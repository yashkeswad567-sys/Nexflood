version: '3.8'

services:
  indore-flood-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indore_flood_intelligence
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - SECRET_KEY=indore-flood-intelligence-prod-secret-2026
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
